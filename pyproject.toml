[project]
name = "experience-factory"
version = "0.1.0"
description = "Long-term memory for LLM-based agents, modelled on Basili's Experience Factory, QIP and GQM."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyarrow>=26.0.1",
]

[project.scripts]
experience-factory = "experience_factory.cli:main"

[dependency-groups]
dev = [
    "pyarrow-stubs>=20.0.0.20260819",
    "pyright>=1.1.400",
    "pytest>=8.3",
    "ruff>=0.11",
]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
